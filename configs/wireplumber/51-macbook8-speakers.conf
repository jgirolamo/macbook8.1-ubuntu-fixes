# MacBook8,1: four CS4208 speaker amps — prefer Surround 4.1 over stereo front-only.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.pci-0000_00_1b.0"
      }
    ]
    actions = {
      update-props = {
        device.profile = "output:analog-surround-41+input:analog-stereo"
      }
    }
  }
]

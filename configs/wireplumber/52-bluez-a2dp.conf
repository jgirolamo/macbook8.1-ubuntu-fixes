# Prefer robust A2DP codecs; avoid auto-HFP when a headset mic appears.
monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.codecs = [ sbc_xq sbc aac ]
  bluez5.hfphsp-backend = "native"
  # Don't auto-switch to HFP just because an input exists
  bluez5.hw-volume = [ "hfp_hf" "hsp_hs" ]
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        # Prefer A2DP music profile over headset duplex
        device.profile = "a2dp-sink-sbc_xq"
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
]
